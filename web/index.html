<html lang="en">

    #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }

            for (const target of event.affected_objects ?? []) if (target.kind === 'visual') { const previous = before?.visuals?.[target.id]?.layout; const next = scene?.visuals?.[target.id]?.layout; if (previous && next && (previous.w !== next.w || previous.h !== next.h)) visualRenderCache.reflow(target.id, next, reflowCachedVisual.bind(null, target.id)); }
            return;
          }
          if (event.type === 'history.changed' || event.type === 'annotation.created' || event.type === 'annotation.changed' || event.type === 'focus.changed') await reloadScene();
        }).catch((error) => console.error('socket event render failed', error));
      });
    }
    await reloadScene();
    connectSocket();
  </script>
</body>
</html>
