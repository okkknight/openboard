<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenBoard — Data Canvas</title>
  <style>
    :root { color-scheme: dark; --bg: #0d1117; --panel: #151b24; --panel-2: #1b2430; --line: #2b3645; --muted: #9aa8ba; --text: #edf3fb; --accent: #6bd8c4; --focus: #f6c86e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
    header { height: 64px; display: flex; align-items: center; gap: 22px; padding: 0 24px; border-bottom: 1px solid var(--line); background: rgba(13,17,23,.94); position: sticky; top: 0; z-index: 5; }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: .02em; }
    .eyebrow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
    .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #d66b72; }
    .status.connected::before { background: var(--accent); }
    .spacer { flex: 1; }
    button { border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); color: var(--text); padding: 7px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .revision { color: var(--muted); font-variant-numeric: tabular-nums; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; height: calc(100vh - 64px); }
    main.details-hidden { grid-template-columns: minmax(0, 1fr); }
    #viewport { position: relative; overflow: auto; background: radial-gradient(circle at 1px 1px, #202b38 1px, transparent 0) 0 0 / 24px 24px; }
    #board { position: relative; min-width: 1200px; min-height: 900px; transform-origin: 0 0; }
    .visual-card { position: absolute; overflow: hidden; min-width: 260px; min-height: 180px; border: 1px solid var(--line); border-radius: 12px; background: rgba(21,27,36,.97); box-shadow: 0 14px 30px rgba(0,0,0,.22); transition: border-color .15s, box-shadow .15s; }
    .visual-card.is-focused { border-color: var(--focus); box-shadow: 0 0 0 2px rgba(246,200,110,.24), 0 14px 30px rgba(0,0,0,.28); }
    .visual-head { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-bottom: 1px solid var(--line); }
    .visual-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .visual-id { margin-left: auto; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, monospace; }
    .plot { display: grid; place-items: center; min-height: 140px; padding: 8px; }
    .plot svg { max-width: 100%; height: auto; }
    .plot table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .plot th, .plot td { padding: 5px 7px; border-bottom: 1px solid var(--line); text-align: left; }
    .plot th { color: var(--muted); font-weight: 600; }
    .kpi-value { font-size: 38px; font-weight: 700; color: var(--accent); }
    .working-frame { align-self: stretch; min-height: 118px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px; color: var(--muted); border-left: 2px solid var(--accent); }
    .working-frame strong { color: var(--text); font-size: 13px; font-weight: 600; }
    .visual-error { margin: 22px; color: #f39a9f; }
    aside { overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 22px; }
    .details-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .details-heading h1 { margin: 0; font-size: 14px; }
    .details-heading button { padding: 4px 8px; font-size: 12px; }
    aside p { margin: 0 0 18px; color: var(--muted); }
    .annotation { padding: 10px 0; border-top: 1px solid var(--line); }
    .annotation strong { display: block; color: var(--focus); font-size: 12px; margin-bottom: 3px; }
    #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
    #empty[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <span class="brand">OpenBoard</span><span class="eyebrow">Data Canvas</span>
    <span id="connection" class="status">Connecting…</span><span class="spacer"></span>
    <span id="revision" class="revision" data-testid="revision">Revision 0</span>
    <button id="show-details" type="button" aria-controls="canvas-details">Show details</button><button id="fit" type="button">Fit view</button><button id="reset" type="button">Reset view</button>
  </header>
  <main id="canvas-layout" class="details-hidden">
    <section id="viewport" aria-label="Data canvas viewport"><div id="board"></div><div id="empty">No visuals yet. Ask Codex to paint the first view.</div></section>
    <aside id="canvas-details" aria-label="Canvas details" hidden><div class="details-heading"><h1>Canvas details</h1><button id="toggle-details" type="button" aria-controls="canvas-details" aria-expanded="false">Hide</button></div><p id="canvas-meta">Loading scene…</p><div id="annotations"></div></aside>
  </main>
  <script src="/assets/d3.js"></script><script src="/assets/plot.js"></script>
  <script type="module">
    import { acceptWorkEvent } from '/assets/work-event-order.js';
    import { createRenderIdentityRegistry } from '/assets/render-identity-registry.js';
    import { annotateDetachedPlotLayer, createRenderGenerationTracker, markClass, reconcilePlotViewport } from '/assets/render-reconciler.js';
    import { createRenderMotion } from '/assets/render-motion.js';
    import { crossMarkTransition } from '/assets/cross-mark-transition.js';
    const board = document.querySelector('#board');
    const viewport = document.querySelector('#viewport');
    const empty = document.querySelector('#empty');
    const connection = document.querySelector('#connection');
    const revision = document.querySelector('#revision');
    const canvasMeta = document.querySelector('#canvas-meta');
    const annotations = document.querySelector('#annotations');
    const canvasLayout = document.querySelector('#canvas-layout');
    const canvasDetails = document.querySelector('#canvas-details');
    const toggleDetails = document.querySelector('#toggle-details');
    const showDetails = document.querySelector('#show-details');
    let durableScene = null;
    let scene = null;
    let zoom = 1;
    const renderedVisualSignatures = new Map();
    const activeWorks = new Map();
    const lastSequence = new Map();
    const renderIdentity = createRenderIdentityRegistry();
    const renderGenerations = createRenderGenerationTracker();

    const setConnection = (text, connected) => { connection.textContent = text; connection.classList.toggle('connected', connected); };
    const setDetailsVisible = (visible) => {
      canvasLayout.classList.toggle('details-hidden', !visible);
      canvasDetails.hidden = !visible;
      toggleDetails.setAttribute('aria-expanded', String(visible));
      showDetails.hidden = visible;
    };
    const cardFor = (id) => board.querySelector(`[data-visual="${CSS.escape(id)}"]`);
    const applyLayout = (card, layout, animate = false) => {
      const before = animate && !motionReduced() ? card.getBoundingClientRect() : null;
      card.style.left = `${layout.x}px`; card.style.top = `${layout.y}px`; card.style.width = `${layout.w}px`; card.style.height = `${layout.h}px`;
      if (!before) return;
      const after = card.getBoundingClientRect();
      const dx = before.left - after.left; const dy = before.top - after.top;
      const sx = after.width ? before.width / after.width : 1; const sy = after.height ? before.height / after.height : 1;
      if (dx || dy || sx !== 1 || sy !== 1) card.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` }, { transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)' });
    };
    function animateCardBirth(card, parent) {
      if (motionReduced()) return;
      const origin = parent?.getBoundingClientRect(); const target = card.getBoundingClientRect();
      const dx = origin ? origin.left - target.left : 0; const dy = origin ? origin.top - target.top : 10;
      card.animate([{ opacity: 0, transform: `translate(${dx}px, ${dy}px) scale(.96)` }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
    async function removeCard(card) {
      if (!card) return;
      if (!motionReduced()) await card.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-8px) scale(.98)' }], { duration: 160, easing: 'ease-in', fill: 'both' }).finished.catch(() => {});
      card.remove();
    }
    function revealNewVisual(card) {
      if (!card?.isConnected) return;
      requestAnimationFrame(() => { if (card.isConnected) card.scrollIntoView({ behavior: 'instant', block: 'nearest', inline: 'nearest' }); });
    }
    function fitView() {
      const cards = [...board.querySelectorAll('.visual-card')];
      if (!cards.length) return;
      const right = Math.max(...cards.map((card) => parseFloat(card.style.left) + parseFloat(card.style.width)));
      const bottom = Math.max(...cards.map((card) => parseFloat(card.style.top) + parseFloat(card.style.height)));
      const availableWidth = Math.max(1, Math.min(viewport.clientWidth, window.innerWidth));
      const availableHeight = Math.max(1, Math.min(viewport.clientHeight, window.innerHeight - 64));
      zoom = Math.min(1, (availableWidth - 48) / right, (availableHeight - 48) / bottom);
      board.style.transform = `scale(${zoom})`;
      viewport.scrollLeft = 0;
      viewport.scrollTop = 0;
    }
    const markToPlot = (mark, data) => {
      const factory = Plot[mark.type];
      if (typeof factory !== 'function') throw new Error(`unsupported mark ${mark.type}`);
      return factory(data, {
        ...(mark.options || {}),
        className: markClass(mark.id),
        render(index, scales, values, dimensions, context, next) {
          return annotateDetachedPlotLayer(next(index, scales, values, dimensions, context), mark);
        }
      });
    };
    const plotData = (rows) => rows.map((row) => Object.fromEntries(Object.entries(row).map(([key, value]) => [key, typeof value === 'string' && /^\d{4}-\d{2}-\d{2}(?:T|$)/.test(value) ? new Date(value) : value])));
    const svgElement = (name) => document.createElementNS('http://www.w3.org/2000/svg', name);
    const plotPalette = ['#6bd8c4', '#f6c86e', '#8aa6ff', '#e889bd', '#f39a9f', '#8bd17c', '#d6a2e8', '#9aa8ba'];
    const primitivePalette = plotPalette;
    const primitiveColor = (value, index) => typeof value === 'string' && /^(#|rgb\(|hsl\(|transparent$|currentColor$)/i.test(value) ? value : primitivePalette[index % primitivePalette.length];
    const numeric = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
    const motionReduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const renderMotion = createRenderMotion({ reduced: motionReduced });
    const easeOut = (progress) => 1 - Math.pow(1 - progress, 3);
    const visualSignature = (visual) => JSON.stringify({ kind: visual.kind, source: visual.source, query: visual.query, coordinate: visual.coordinate, marks: visual.marks });
    const shouldAnimateVisual = (visual) => {
      const signature = visualSignature(visual);
      const changed = renderedVisualSignatures.get(visual.id) !== signature;
      renderedVisualSignatures.set(visual.id, signature);
      return changed && !motionReduced();
    };
    function animateElement(element, kind, keyframes, options) {
      element.dataset.entranceAnimation = kind;
      requestAnimationFrame(() => {
        const animation = element.animate(keyframes, { duration: 460, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both', ...options });
        animation.onfinish = () => { element.style.transform = ''; element.style.opacity = ''; element.style.strokeDasharray = ''; element.style.strokeDashoffset = ''; };
      });
    }
    function animateArc(path, arc, row, index) {
      const startAngle = numeric(row.startAngle);
      const endAngle = numeric(row.endAngle);
      const delay = index * 80;
      const duration = 520;
      path.dataset.entranceAnimation = 'arc';
      path.setAttribute('d', arc({ ...row, endAngle: startAngle }) || '');
      const startedAt = performance.now() + delay;
      const frame = (now) => {
        if (now < startedAt) return requestAnimationFrame(frame);

    function animatePrimitiveMark(element, type, index = 0) {
      if (type === 'text') {
        animateElement(element, 'text', [{ transform: 'translateY(6px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], { duration: 220, delay: index * 45 });
        return;
      }
      if (type === 'rect' || type === 'area') {
        element.style.transformBox = 'fill-box'; element.style.transformOrigin = 'center bottom';
        animateElement(element, type, [{ transform: 'scaleY(0)', opacity: 0.2 }, { transform: 'scaleY(1)', opacity: 1 }], { delay: index * 55 });
        return;
      }
      if (type === 'circle') {
        element.style.transformBox = 'fill-box'; element.style.transformOrigin = 'center';
        animateElement(element, 'circle', [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 260, delay: index * 55 });
        return;

      } else animateElement(element, type, [{ opacity: 0 }, { opacity: 1 }], { delay: index * 55 });
    }
    function animatePlotMarks(svg) {
      svg.querySelectorAll('g[aria-label="bar"] rect').forEach((rect, index) => {
        rect.style.transformBox = 'fill-box'; rect.style.transformOrigin = 'center bottom';
        animateElement(rect, 'bar', [{ transform: 'scaleY(0)', opacity: 0.2 }, { transform: 'scaleY(1)', opacity: 1 }], { delay: index * 65 });
      });
      svg.querySelectorAll('g[aria-label="line"] path').forEach((path) => {
        const length = path.getTotalLength?.();
        if (!length) return;
        path.style.strokeDasharray = `${length} ${length}`; path.style.strokeDashoffset = String(length);
        animateElement(path, 'line', [{ strokeDashoffset: String(length), opacity: 0.35 }, { strokeDashoffset: '0', opacity: 1 }], { duration: 620 });
      });
      svg.querySelectorAll('g[aria-label="dot"] circle').forEach((dot, index) => {
        dot.style.transformBox = 'fill-box'; dot.style.transformOrigin = 'center';
        animateElement(dot, 'dot', [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 260, delay: 280 + index * 70 });
      });
      svg.querySelectorAll('g[aria-label]').forEach((group) => {
        const type = group.getAttribute('aria-label');
        if (!['area', 'rect', 'cell', 'rule', 'text', 'tick', 'box'].includes(type)) return;
        group.querySelectorAll('path, rect, circle, line, text').forEach((element, index) => animatePrimitiveMark(element, type === 'text' ? 'text' : type === 'area' ? 'area' : type === 'rect' || type === 'cell' || type === 'box' ? 'rect' : type, index));
      });
    }
    function renderPrimitiveLayer(layer, width, height, svg, animate) {
      const group = svgElement('g'); group.setAttribute('data-primitive', layer.id); group.dataset.markId = layer.id; group.dataset.markType = layer.type; group.dataset.renderer = 'primitive'; group.dataset.identityMode = layer.identity.identity_mode; group.dataset.layerKey = layer.identity.layer_key;
      const values = layer.values || []; const options = layer.options || {};
      if (layer.type === 'arc') {
        const radius = Math.max(1, Math.min(width, height) / 2 - 12);
        const cx = width / 2; const cy = height / 2;
        values.forEach((row, index) => {
          const path = svgElement('path');
          const arc = d3.arc().innerRadius(numeric(row.innerRadius) * radius).outerRadius(numeric(row.outerRadius, 1) * radius).startAngle(numeric(row.startAngle)).endAngle(numeric(row.endAngle));
          path.setAttribute('d', arc(row) || ''); path.setAttribute('transform', `translate(${cx},${cy})`);
          path.setAttribute('fill', primitiveColor(row.fill ?? row.color ?? options.fill, index));
          path.setAttribute('stroke', String(row.stroke ?? options.stroke ?? '#0d1117'));
          path.setAttribute('stroke-width', String(options.strokeWidth ?? 1)); if (row.render_key) path.dataset.renderKey = row.render_key; group.append(path);
          if (animate) animateArc(path, arc, row, index);
          if (row.label !== undefined && row.label !== null && String(row.label).trim()) {
            const label = svgElement('text');
            const midpointRadius = ((numeric(row.innerRadius) + numeric(row.outerRadius, 1)) / 2) * radius;
            const midpointAngle = (numeric(row.startAngle) + numeric(row.endAngle)) / 2;
            // Observable Plot/D3 arcs use angle 0 at 12 o'clock and increase clockwise.
            label.setAttribute('x', String(cx + Math.sin(midpointAngle) * midpointRadius));
            label.setAttribute('y', String(cy - Math.cos(midpointAngle) * midpointRadius));
            label.setAttribute('fill', String(options.labelColor ?? '#0d1117'));
            label.setAttribute('font-size', String(options.labelFontSize ?? 11));
            label.setAttribute('font-weight', String(options.labelFontWeight ?? 600));
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('dominant-baseline', 'middle');
            label.setAttribute('pointer-events', 'none');
            if (row.render_key) label.dataset.renderKey = `${row.render_key}:label`;
            const percent = Number(row.percent);
            label.textContent = Number.isFinite(percent) ? `${String(row.label)} ${Math.round(percent * 100)}%` : String(row.label);
            group.append(label);
            if (animate) animateElement(label, 'arc-label', [{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: 220 + index * 80 });
          }
        });
      } else if (layer.type === 'circle') {
        values.forEach((row, index) => {
          const circle = svgElement('circle'); circle.setAttribute('cx', String(numeric(row._x))); circle.setAttribute('cy', String(numeric(row._y))); circle.setAttribute('r', String(Math.max(0, numeric(row._radius ?? row._size, 4))));
          circle.setAttribute('fill', primitiveColor(row._fill ?? row._color ?? options.fill, index)); if (row._stroke ?? options.stroke) circle.setAttribute('stroke', String(row._stroke ?? options.stroke)); if (row.render_key) circle.dataset.renderKey = row.render_key; group.append(circle);
          if (animate) animatePrimitiveMark(circle, 'circle', index);
        });
      } else if (layer.type === 'line') {
        values.forEach((row, index) => {
          const line = svgElement('line'); line.setAttribute('x1', String(numeric(row._x1 ?? row._x))); line.setAttribute('y1', String(numeric(row._y1 ?? row._y))); line.setAttribute('x2', String(numeric(row._x2 ?? row._x))); line.setAttribute('y2', String(numeric(row._y2 ?? row._y))); line.setAttribute('stroke', String(row._stroke ?? options.stroke ?? primitiveColor(row._color, index))); line.setAttribute('stroke-width', String(options.strokeWidth ?? 2)); if (row.render_key) line.dataset.renderKey = row.render_key; group.append(line);
          if (animate) animatePrimitiveMark(line, 'line', index);
        });
      } else if (layer.type === 'rect') {
        values.forEach((row, index) => {
          const rect = svgElement('rect'); const x = numeric(row._x); const y = numeric(row._y); const x2 = numeric(row._x2, x + numeric(row._width, 10)); const y2 = numeric(row._y2, y + numeric(row._height, 10)); rect.setAttribute('x', String(Math.min(x, x2))); rect.setAttribute('y', String(Math.min(y, y2))); rect.setAttribute('width', String(Math.abs(x2 - x))); rect.setAttribute('height', String(Math.abs(y2 - y))); rect.setAttribute('fill', primitiveColor(row._fill ?? row._color ?? options.fill, index)); if (row.render_key) rect.dataset.renderKey = row.render_key; group.append(rect);
          if (animate) animatePrimitiveMark(rect, 'rect', index);
        });
      } else if (layer.type === 'path') {
        const path = svgElement('path'); path.setAttribute('d', String(options.d)); if (options.fill !== undefined) path.setAttribute('fill', String(options.fill)); if (options.stroke !== undefined) path.setAttribute('stroke', String(options.stroke)); if (values[0]?.render_key) path.dataset.renderKey = values[0].render_key; group.append(path); if (animate) animatePrimitiveMark(path, 'path');
      } else if (layer.type === 'text') {
        values.forEach((row, index) => { const text = svgElement('text'); text.setAttribute('x', String(numeric(row._x))); text.setAttribute('y', String(numeric(row._y))); text.setAttribute('fill', String(row._fill ?? options.fill ?? '#edf3fb')); text.textContent = String(row._text ?? ''); if (row.render_key) text.dataset.renderKey = row.render_key; group.append(text); if (animate) animatePrimitiveMark(text, 'text', index); });
      } else if (layer.type === 'area') {
        const points = values.map((row) => [numeric(row._x), numeric(row._y)]); if (points.length) { const path = svgElement('path'); path.setAttribute('d', `M ${points.map(([x, y]) => `${x} ${y}`).join(' L ')} Z`); path.setAttribute('fill', String(options.fill ?? '#6bd8c4')); path.setAttribute('fill-opacity', String(options.fillOpacity ?? 0.35)); if (values[0]?.render_key) path.dataset.renderKey = values[0].render_key; group.append(path); if (animate) animatePrimitiveMark(path, 'area'); }
      }
      svg.append(group);
    }

    function mergeEffectiveScene() {
      const merged = structuredClone(durableScene);
      for (const work of activeWorks.values()) {
        const overlay = work.overlay;
        for (const id of overlay.removed_visual_ids || []) delete merged.visuals[id];
        for (const [id, visual] of Object.entries(overlay.visuals || {})) merged.visuals[id] = structuredClone(visual);
        for (const id of overlay.removed_annotation_ids || []) delete merged.annotations[id];
        for (const [id, annotation] of Object.entries(overlay.annotations || {})) merged.annotations[id] = structuredClone(annotation);
        if (overlay.canvas) merged.canvas = structuredClone(overlay.canvas);
      }
      return merged;
    }
    const workForVisual = (id) => [...activeWorks.values()].find((work) => work.overlay.visuals?.[id] || work.overlay.removed_visual_ids?.includes(id))?.id;
    const visualLayout = (visual) => visual.layout || { x: 0, y: 0, w: 480, h: 320 };

    async function render(id, workId = workForVisual(id)) {
      const requestGeneration = renderGenerations.request(id);
      renderMotion.begin(id, requestGeneration);
      const url = '/api/visual/' + encodeURIComponent(id) + (workId ? `?work_id=${encodeURIComponent(workId)}` : '');
      const response = await fetch(url);
      if (!response.ok) throw new Error(`visual ${id} unavailable`);
      const payload = await response.json();
      if (!renderGenerations.accepts(id, requestGeneration)) return;
      renderIdentity.remember(payload.result.artifact, payload.result.plot);
      const visual = payload.result.visual;
      let card = cardFor(id);
      let createdCard = false;
      if (!card) {
        createdCard = true;
        card = document.createElement('article'); card.className = 'visual-card'; card.dataset.visual = id;
        const head = document.createElement('div'); head.className = 'visual-head';
        const title = document.createElement('span'); title.className = 'visual-title';
        const visualId = document.createElement('span'); visualId.className = 'visual-id'; visualId.textContent = id;
        head.append(title, visualId); card.append(head, Object.assign(document.createElement('div'), { className: 'plot' })); board.append(card);
        animateCardBirth(card, visual.derived_from ? cardFor(visual.derived_from) : undefined);
      }
      card.querySelector('.visual-title').textContent = visual.title || id;
      applyLayout(card, visualLayout(visual));
      if (createdCard) revealNewVisual(card);
      const plot = card.querySelector('.plot');
      try {
        const renderRows = plotData(payload.result.plot.data);
        if (payload.status === 'working') {
          const dimensions = visual.query?.dimensions?.map((item) => item.alias || item.field).join(' · ');
          const activity = activeWorks.get(workId)?.activity?.label;
          const frame = document.createElement('div'); frame.className = 'working-frame';
          frame.append(Object.assign(document.createElement('strong'), { textContent: visual.title || id }));
          if (dimensions) frame.append(Object.assign(document.createElement('span'), { textContent: dimensions }));
          if (activity) frame.append(Object.assign(document.createElement('span'), { textContent: activity }));
          plot.replaceChildren(frame);
        } else if (visual.kind === 'table') {
          const table = document.createElement('table'); const fields = payload.result.columns;
          const head = document.createElement('tr'); fields.forEach((field) => head.append(Object.assign(document.createElement('th'), { textContent: field }))); const thead = document.createElement('thead'); thead.append(head); table.append(thead);
          const body = document.createElement('tbody'); payload.result.plot.data.forEach((row) => { const tr = document.createElement('tr'); fields.forEach((field) => tr.append(Object.assign(document.createElement('td'), { textContent: row[field] == null ? '' : String(row[field]) }))); body.append(tr); }); table.append(body); plot.replaceChildren(table);
        } else if (visual.kind === 'kpi') {
          const first = payload.result.plot.data[0] || {}; const value = Object.values(first)[0] ?? payload.result.rows;
          plot.replaceChildren(Object.assign(document.createElement('div'), { className: 'kpi-value', textContent: String(value) }));
        } else {
          const layout = visualLayout(visual); const width = Math.max(220, layout.w - 16); const height = Math.max(120, layout.h - 48);
          const svg = Plot.plot({ width, height, margin: 32, color: { range: plotPalette }, marks: payload.result.plot.marks.map((mark) => markToPlot(mark, renderRows)) });
          for (const primitive of payload.result.plot.primitives || []) renderPrimitiveLayer(primitive, width, height, svg, false);
          reconcilePlotViewport(plot, svg, visual, payload.result.artifact, {
            onEnter: (element, operation, meta) => renderMotion.apply({ visualId: id, generation: requestGeneration, operation, markType: meta.markType, element, index: meta.index }),
            onUpdate: (element, operation, meta) => renderMotion.apply({ visualId: id, generation: requestGeneration, operation, markType: meta.markType, element, from: meta.from, index: meta.index }),
            onExit: (element, operation, meta) => renderMotion.apply({ visualId: id, generation: requestGeneration, operation, markType: meta.markType, element, index: meta.index }),
            onReplaceLayer: (element, nextLayer, operation, meta) => {
              element.dataset.transition = crossMarkTransition(meta.fromMarkType, meta.markType).kind;
              return renderMotion.apply({ visualId: id, generation: requestGeneration, operation: { ...operation, type: 'exit' }, markType: meta.fromMarkType, element, index: meta.index });
            }
          });
        }
      } catch (error) { plot.replaceChildren(Object.assign(document.createElement('p'), { className: 'visual-error', textContent: error.message })); }
      card.classList.toggle('is-focused', scene?.canvas?.focus === id);
      empty.hidden = board.querySelectorAll('.visual-card').length > 0;
    }

    function updateScene(next, animateLayout = false) {
      scene = next; revision.textContent = `Revision ${durableScene.revision}`;
      canvasMeta.textContent = `${Object.keys(scene.visuals).length} visual${Object.keys(scene.visuals).length === 1 ? '' : 's'} · ${Object.keys(scene.datasets).length} dataset${Object.keys(scene.datasets).length === 1 ? '' : 's'}`;
      annotations.replaceChildren(...Object.values(scene.annotations).map((annotation) => { const item = document.createElement('div'); item.className = 'annotation'; item.innerHTML = '<strong>Note</strong>'; item.append(document.createTextNode(annotation.text)); return item; }));
      for (const card of board.querySelectorAll('.visual-card')) { const visual = scene.visuals[card.dataset.visual]; if (visual) applyLayout(card, visualLayout(visual), animateLayout); card.classList.toggle('is-focused', scene.canvas.focus === card.dataset.visual); }
    }

    async function renderEffectiveScene() {
      const existingIds = new Set([...board.querySelectorAll('.visual-card')].map((card) => card.dataset.visual));
      updateScene(mergeEffectiveScene());
      for (const card of board.querySelectorAll('.visual-card')) if (!scene.visuals[card.dataset.visual]) card.remove();
      await Promise.all(Object.keys(scene.visuals).map((id) => render(id)));
      if (Object.keys(scene.visuals).some((id) => !existingIds.has(id))) fitView();
      empty.hidden = board.querySelectorAll('.visual-card').length > 0;
    }
    async function reloadScene() {
      const [nextDurable, workSnapshot] = await Promise.all([fetch('/api/scene').then((response) => response.json()), fetch('/api/works').then((response) => response.json())]);
      durableScene = nextDurable;
      activeWorks.clear();
      for (const snapshot of workSnapshot.works) activeWorks.set(snapshot.work.id, snapshot.work);
      await renderEffectiveScene();
    }
    document.querySelector('#fit').addEventListener('click', fitView);
    document.querySelector('#reset').addEventListener('click', () => { zoom = 1; board.style.transform = 'scale(1)'; });
    toggleDetails.addEventListener('click', () => setDetailsVisible(false));
    showDetails.addEventListener('click', () => setDetailsVisible(true));
    setDetailsVisible(false);
    let socket = null;
    let reconnectTimer = null;
    let reconnectDelay = 250;
    const socketUrl = () => `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
    const scheduleSocketReconnect = () => {
      if (reconnectTimer !== null) return;
      reconnectTimer = window.setTimeout(() => { reconnectTimer = null; connectSocket(); }, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 5000);
    };
    function connectSocket() {
      if (socket && (socket.readyState === WebSocket.CONNECTING || socket.readyState === WebSocket.OPEN)) return;
      setConnection('Connecting…', false);
      const nextSocket = new WebSocket(socketUrl());
      socket = nextSocket;
      nextSocket.addEventListener('open', async () => {
        reconnectDelay = 250;
        setConnection('Connected', true);
        try { await reloadScene(); } catch { scheduleSocketReconnect(); }
      });
      nextSocket.addEventListener('close', () => {
        if (socket !== nextSocket) return;
        setConnection('Disconnected', false);
        scheduleSocketReconnect();
      });
      nextSocket.addEventListener('error', () => { if (socket === nextSocket) setConnection('Connection error', false); });
      nextSocket.addEventListener('message', async ({ data }) => {
        const event = JSON.parse(data);
        if (event.type.startsWith('work.')) {
          if (!acceptWorkEvent(lastSequence, event)) return;
          if (event.type === 'work.completed' || event.type === 'work.cancelled') {
            activeWorks.delete(event.work_id);
            if (event.type === 'work.completed') durableScene = await fetch('/api/scene').then((response) => response.json());
          } else if (event.work) activeWorks.set(event.work_id, event.work);
          await renderEffectiveScene();
          return;
        }
        if (event.type === 'visual.removed' && event.visual_id) {
          await removeCard(cardFor(event.visual_id));
          durableScene = await fetch('/api/scene').then((response) => response.json());
          updateScene(mergeEffectiveScene());
          empty.hidden = board.querySelectorAll('.visual-card').length > 0;
          return;
        }
        else if (event.visual_id) await render(event.visual_id);
        if (event.type === 'layout.changed') {
          durableScene = await fetch('/api/scene').then((response) => response.json());
          updateScene(mergeEffectiveScene(), true);
          return;
        }
        if (event.type === 'history.changed' || event.type === 'annotation.created' || event.type === 'focus.changed') await reloadScene();
      });
    }
    await reloadScene();
    connectSocket();
  </script>
</body>
</html>
